# Everything needed to run the whole stack locally:
#
#   cp .env.example .env     # add your GEMINI_API_KEY
#   docker compose up --build
#   open http://localhost:8080
#
# Only the web container publishes a port. Everything else talks over the
# internal compose network, so on a public server nothing else is reachable.
# docker-compose.override.yaml (loaded automatically in local development)
# adds the database and service ports back for poking at.
#
# On the server: WEB_PORT=80 in .env, and start with
#   docker compose -f docker-compose.yaml up -d --build
# The -f skips the dev override.

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    restart: unless-stopped
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-service:
    restart: unless-stopped
    build: ./python-service
    environment:
      MONGO_URI: mongodb://mongo:27017
      LLM_PROVIDER_CHAIN: ${LLM_PROVIDER_CHAIN:-gemini,openai}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  node-api:
    restart: unless-stopped
    build: ./node-api
    environment:
      DATABASE_URL: postgres://rag:rag@postgres:5432/rag
      RAG_SERVICE_URL: http://python-service:8000
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      python-service:
        condition: service_started

  web:
    restart: unless-stopped
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - node-api

volumes:
  postgres-data:
  mongo-data:
