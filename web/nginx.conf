# Rate limit for the one endpoint that costs money.
#
# /api/ask calls a hosted language model on every request, so an open instance
# on the public internet is someone else's free API quota. Retrieval and the
# document endpoints are cheap and local, so they are left alone.
#
# 6 requests per minute per IP, with a burst of 3 so a quick second question
# is not punished. This lives here rather than in the Node service because
# nginx already sits in front of everything and it needs no new dependency.
limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=6r/m;

server {
    listen 80;

    # nginx resolves a hostname in proxy_pass once, at startup, and caches the
    # address forever. Recreating the node-api container gives it a new IP and
    # every request then 502s against the old one — which happens on any
    # redeploy, not just in development.
    #
    # Naming Docker's embedded DNS server and putting the upstream in a
    # variable forces a fresh lookup, so a redeployed backend is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $node_api "http://node-api:3001";

    # Single-page app: unknown paths return index.html rather than a 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /api/ask {
        limit_req zone=ask_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass $node_api/api/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generation can take ten seconds or so; the default 60s read timeout
        # is fine, but be explicit so it is not mistaken for an oversight.
        proxy_read_timeout 60s;
    }

    # Same-origin proxy for everything else, so the browser never makes a
    # cross-origin request and the API URL is not baked into the JS bundle.
    location /api/ {
        proxy_pass $node_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
