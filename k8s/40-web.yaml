apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: semantic-rag-search-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # nginx's resolver queries this name verbatim — it does not apply
            # the search domains from resolv.conf — so it has to be the fully
            # qualified service name here. Under Compose the short name works
            # and the image's default is used instead.
            - name: NODE_API_UPSTREAM
              value: http://node-api.default.svc.cluster.local:3001
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 128Mi, cpu: 200m }
---
# NodePort rather than LoadBalancer: minikube has no cloud load balancer to
# hand out. `minikube service web` opens it.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
