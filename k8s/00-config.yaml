# Non-secret settings shared by the services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
data:
  MONGO_URI: mongodb://mongo:27017
  DATABASE_URL: postgres://rag:rag@postgres:5432/rag
  RAG_SERVICE_URL: http://python-service:8000
  LLM_PROVIDER: gemini
---
# The API key is the one value that must not sit in a ConfigMap. Created from
# the command line rather than committed:
#
#   kubectl create secret generic rag-secrets \
#     --from-literal=GEMINI_API_KEY=your-key-here
#
# This placeholder keeps `kubectl apply -f k8s/` working before that; it is
# overwritten by the command above.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
type: Opaque
stringData:
  GEMINI_API_KEY: ""
