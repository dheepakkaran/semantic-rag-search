# Non-secret settings shared by the services.
#
# The API keys are deliberately NOT here. An empty placeholder Secret in this
# file would be applied along with everything else and would silently wipe the
# real keys on every `kubectl apply -f k8s/`. Create them once instead:
#
#   kubectl create secret generic rag-secrets \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=OPENAI_API_KEY=...
#
# Or from the .env file already on disk:
#
#   set -a; . ./.env; set +a
#   kubectl create secret generic rag-secrets \
#     --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
data:
  MONGO_URI: mongodb://mongo:27017
  DATABASE_URL: postgres://rag:rag@postgres:5432/rag
  RAG_SERVICE_URL: http://python-service:8000
  # Gemini first; OpenAI takes over when the daily free-tier quota runs out.
  LLM_PROVIDER_CHAIN: gemini,openai
