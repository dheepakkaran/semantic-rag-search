apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: python-service }
  template:
    metadata:
      labels: { app: python-service }
    spec:
      containers:
        - name: python-service
          image: semantic-rag-search/python-service:latest
          # minikube builds images straight into its own daemon, so there is
          # nothing to pull from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef: { name: rag-config, key: MONGO_URI }
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef: { name: rag-config, key: LLM_PROVIDER }
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: rag-secrets, key: GEMINI_API_KEY }
          # Liveness restarts a wedged container; readiness keeps traffic away
          # until the embedding model has finished loading, which takes a few
          # seconds after start.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits: { memory: 1536Mi, cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
spec:
  selector: { app: python-service }
  ports:
    - port: 8000
      targetPort: 8000
