apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  # Stateless, so more than one replica is safe: the databases hold all state.
  replicas: 2
  selector:
    matchLabels: { app: node-api }
  template:
    metadata:
      labels: { app: node-api }
    spec:
      containers:
        - name: node-api
          image: semantic-rag-search-node-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef: { name: rag-config, key: DATABASE_URL }
            - name: RAG_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: rag-config, key: RAG_SERVICE_URL }
            - { name: PORT, value: "3001" }
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: node-api
spec:
  selector: { app: node-api }
  ports:
    - port: 3001
      targetPort: 3001
